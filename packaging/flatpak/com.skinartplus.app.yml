id: com.skinartplus.app
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: skinartplus
finish-args:
  - --socket=wayland # Permission needed to show the window
  - --socket=fallback-x11 # Permission needed to show the window on legacy windowing systems
  - --device=dri # OpenGL, not necessary for all projects
  - --share=ipc
  - --share=network
  - --socket=session-bus # Needed for desktop/file portals
  - --talk-name=org.freedesktop.portal.Desktop # File dialogs, settings, etc.
  - --talk-name=org.freedesktop.portal.OpenURI # Open links in the host browser
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create

modules:
  - name: binary
    buildsystem: simple

    sources:
      - type: file
        path: ../../src-tauri/target/release/bundle/deb/skinartplus_1.0.0_amd64.deb
        only-arches: [x86_64]
      - type: file
        path: flatpak.metainfo.xml

    build-commands:
      - set -e

      # Extract the deb package (handles data.tar.gz/.xz/.zst)
      - mkdir deb-extract
      - ar -x *.deb --output deb-extract
      - cd deb-extract && for t in data.tar.*; do tar -xf "$t"; done && cd -

      # Copy binary
      - 'install -Dm755 deb-extract/usr/bin/skinartplus /app/bin/skinartplus'

      # If you bundle files with additional resources, you should copy them:
      - mkdir -p /app/lib/Skinart+
      - cp -r deb-extract/usr/lib/Skinart+/. /app/lib/Skinart+ 2>/dev/null || true
      - find /app/lib/Skinart+ -type f -exec chmod 644 {} \; 2>/dev/null || true

      # Copy desktop file + ensure the right icon is set
      - sed -i 's/^Icon=.*/Icon=com.skinartplus.app/' deb-extract/usr/share/applications/Skinart+.desktop
      - install -Dm644 deb-extract/usr/share/applications/Skinart+.desktop /app/share/applications/com.skinartplus.app.desktop

      # Copy icons (all available sizes)
      - for size in 16 22 24 32 48 64 128 256 512; do install -Dm644 "deb-extract/usr/share/icons/hicolor/${size}x${size}/apps/skinartplus.png" "/app/share/icons/hicolor/${size}x${size}/apps/com.skinartplus.app.png" 2>/dev/null || true; done
      - install -Dm644 flatpak.metainfo.xml /app/share/metainfo/com.skinartplus.app.metainfo.xml
