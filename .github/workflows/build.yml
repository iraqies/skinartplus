name: Build Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: "--bundles deb,rpm,appimage"
          - platform: "windows-latest"
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundles
          path: |
            src-tauri/target/release/bundle/**/*

  flatpak:
    runs-on: ubuntu-22.04
    needs: tauri
    steps:
      - uses: actions/checkout@v4

      - name: Download deb from tauri build
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-22.04-bundles
          path: artifacts/

      - name: Place deb where manifest expects it
        run: |
          mkdir -p src-tauri/target/release/bundle/deb
          cp artifacts/bundle/deb/*.deb src-tauri/target/release/bundle/deb/

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        name: Build Flatpak
        with:
          bundle: SkinartPlus.flatpak
          manifest-path: packaging/flatpak/com.skinartplus.app.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        name: Upload Flatpak
        with:
          name: linux-flatpak
          path: SkinartPlus.flatpak

  release:
    runs-on: ubuntu-latest
    needs: [tauri, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
