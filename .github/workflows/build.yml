name: Build Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: "--bundles deb,rpm,appimage"
          - platform: "windows-latest"
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKINARTPLUS_CLIENT_ID: ${{ secrets.SKINARTPLUS_CLIENT_ID }}
          SKINARTPLUS_CLIENT_SECRET: ${{ secrets.SKINARTPLUS_CLIENT_SECRET }}
          SKINARTPLUS_MS_AUTHORITY: ${{ secrets.SKINARTPLUS_MS_AUTHORITY }}
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe

  flatpak:
    runs-on: ubuntu-22.04
    needs: tauri
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download deb from tauri build
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-22.04-bundles
          path: artifacts/

      - name: Place deb where manifest expects it
        run: |
          set -e
          VERSION=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed 's/.*: "\([^"]*\)".*/\1/')
          ARCH=$(dpkg --print-architecture 2>/dev/null || echo amd64)
          DEB="skinartplus_${VERSION}_${ARCH}.deb"
          echo "Deb name: $DEB"
          mkdir -p src-tauri/target/release/bundle/deb
          cp artifacts/deb/*.deb "src-tauri/target/release/bundle/deb/$DEB"
          sed -i "s|path: ../../src-tauri/target/release/bundle/deb/[^ ]*|path: ../../src-tauri/target/release/bundle/deb/$DEB|" packaging/flatpak/com.skinartplus.app.yml
          grep 'deb/' packaging/flatpak/com.skinartplus.app.yml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        name: Build Flatpak
        with:
          bundle: SkinartPlus.flatpak
          manifest-path: packaging/flatpak/com.skinartplus.app.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        name: Upload Flatpak
        with:
          name: linux-flatpak
          path: SkinartPlus.flatpak

  release:
    runs-on: ubuntu-latest
    needs: [tauri, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Delete existing release for tag (start fresh)
        run: |
          set -euo pipefail
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" || true)
          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting release $RELEASE_ID"
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "Deleted release $RELEASE_ID"
          else
            echo "No existing release"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          name: Fixed a lot of issues
          body: |
            ## What was fixed in this release

            **NameMC Claimer (blockmania login)**
            - Login no longer fails with "The server closed the connection during login on every supported protocol version".
              - Fixed the 1.19.1/1.19.2 attempt: protocol 760 was being sent over the wire as 761, which the blockmania proxy rejects.
              - Fixed silent disconnects from rapid back-to-back login attempts (BungeeCord-style connect throttling) by pausing between protocol attempts.
            - Uses your stored Microsoft account token for the session join, so the claim completes instead of stopping after encryption.

            **Skin upload verification ("Checking session server... (1/60)" stuck)**
            - Uploaded skins are now verified instantly against the upload API response instead of waiting on Mojang's slow session-server cache.
            - The session-server poll still runs as a fallback for the rare case the fast check can't confirm.
          update_release_body: true
